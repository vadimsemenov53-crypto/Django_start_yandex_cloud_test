services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "poetry run python manage.py collectstatic --noinput && poetry run gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles

    expose:
      - "8000"

    depends_on:
      - db
      - redis

    env_file:
      - ./.env

  nginx:
    build:
      context: ./nginx

    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles

    depends_on:
      - web

  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env

  redis:
    image: redis:7
    volumes:
      - redis_data:/data

    env_file:
      - ./.env

volumes:
  postgres_data:
  redis_data:
  static_volume: